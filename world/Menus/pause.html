<style>

   authored menus intentionally do not load external stylesheets or scripts. */
.terra{--ink:#080810;--night:#10102a;--cream:#fff1c1;--cyan:#35d9ff;--pink:#ff4fa3;--gold:#ffd447;--mint:#70f8a0;box-sizing:border-box;color:var(--cream);font:18px/1.35 'VCR OSD Mono','Courier New',monospace;text-shadow:2px 2px 0 var(--ink);image-rendering:pixelated;scrollbar-color:var(--cyan) var(--night);scrollbar-width:thin}
.terra *{box-sizing:border-box}.terra [hidden]{display:none!important}.terra h1,.terra h2,.terra h3,.terra p{margin:0}.terra h1{font-size:clamp(30px,4vw,50px);line-height:1.1;color:var(--gold);text-shadow:3px 3px 0 #af3b43,6px 6px 0 var(--ink)}.terra h2{font-size:26px}.terra h3{font-size:22px;color:var(--cream)}.terra p{margin:12px 0}.terra .eyebrow{font-size:14px;letter-spacing:.12em;color:var(--cyan)}.terra .muted,.terra .caption,.terra small,.terra .help{font-size:15px;color:#b6c7dd}.terra small{display:block;margin-top:5px}.terra .subtitle{color:#b6c7dd;margin:16px 0 24px}.terra .wide{grid-column:1/-1}
.terra-panel,.terra .panel,.indigo-setup,.indigo-shop{border:3px solid var(--cyan);outline:2px solid var(--ink);background:var(--night);box-shadow:6px 6px 0 var(--ink),inset 0 0 0 3px #2a3660;padding:24px;border-radius:0}
.terra button,.terra summary{font:inherit;cursor:pointer}.terra button{position:relative;color:var(--cream);background:#252749;border:2px solid #6c7aaf;border-radius:0;padding:10px 16px;box-shadow:3px 3px 0 var(--ink);text-shadow:2px 2px 0 var(--ink);line-height:1.2}.terra button:hover{background:#394770;border-color:var(--cyan)}.terra button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}.terra :is(button,input,select,textarea,summary):focus-visible{outline:3px solid var(--gold);outline-offset:4px}.terra button:disabled{color:#9396ad;border-color:#535772;background:#202039;cursor:default;box-shadow:none}.terra button:disabled:hover{background:#202039}.terra button.primary,.terra button.fire{background:var(--gold);border-color:var(--cream);color:var(--ink);text-shadow:none}.terra button.selected{background:#26494e;border-color:var(--mint);color:var(--mint)}.terra button.secondary{background:transparent}.terra .actions{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:22px;flex-wrap:wrap}
.terra input,.terra textarea,.terra select{display:block;width:100%;font:inherit;color:var(--cream);background:var(--ink);border:2px solid #6c7aaf;border-radius:0;padding:10px;margin-top:6px;accent-color:var(--gold)}.terra input[type=hidden]{display:none}.terra input[type=checkbox]{display:inline;width:auto}.terra textarea{resize:vertical;min-height:90px}.terra select{appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,#ffd447 50%),linear-gradient(135deg,#ffd447 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 10px) 50%;background-size:6px 6px;background-repeat:no-repeat}.terra label{display:block;font-size:16px}.terra .error{border:2px solid var(--pink);background:#38162e;color:#ffd9e7;padding:12px;margin-top:14px}.terra details{border:2px solid #6c7aaf;padding:14px;margin-top:18px}.terra summary{color:var(--gold)}.terra details[open]>summary{margin-bottom:16px}.terra .fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.terra kbd{font:inherit;color:var(--gold);border:1px solid #6678a7;padding:1px 4px}
.indigo-setup{width:min(1000px,92vw);max-height:88vh;overflow:auto;padding:30px}.indigo-setup .columns{display:grid;grid-template-columns:.8fr 1.2fr;gap:30px}.indigo-setup .landscape{height:155px;position:relative;overflow:hidden;border:2px solid #7582be;background:repeating-linear-gradient(0deg,#10102a 0 3px,#181c3a 3px 6px);margin:18px 0}.indigo-setup .hill{position:absolute;inset:85px -45px -45px;background:#413664;border-top:4px solid var(--pink);transform:rotate(-14deg)}.indigo-setup .hill.far{inset:65px -40px -30px;background:#292c50;transform:rotate(18deg);border-color:var(--cyan)}.indigo-setup .tank{position:absolute;left:95px;top:86px;width:64px;height:24px;background:var(--gold);box-shadow:0 8px 0 var(--ink)}.indigo-setup .tank:before{content:'';position:absolute;left:16px;top:-12px;width:32px;height:16px;background:var(--cream)}.indigo-setup .tank:after{content:'';position:absolute;left:32px;top:-20px;width:45px;height:7px;background:var(--cream);transform:rotate(-30deg);transform-origin:left center}
.indigo-shop{width:min(1180px,94vw);max-height:88vh;overflow:auto}.indigo-shop header{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:3px double var(--cyan);padding-bottom:20px}.indigo-shop h1{margin:8px 0}.indigo-shop .layout{display:grid;grid-template-columns:265px 1fr;gap:24px;margin-top:22px}.indigo-shop .wallet{font-size:42px;color:var(--mint);margin:10px 0}.indigo-shop .basket{background:var(--ink);padding:16px;border:2px solid #556188;align-self:start}.indigo-shop .receipt{display:flex;justify-content:space-between;padding:4px 0;font-size:14px;gap:10px}.indigo-shop .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}.indigo-shop .card{padding:16px;background:#191d3a;border:2px solid #556188;display:flex;flex-direction:column;gap:10px}.indigo-shop .card p{font-size:15px;margin:0;flex:1;color:#c9d1e8}.indigo-shop .card-footer{display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--gold)}.indigo-shop .nav,.indigo-shop .filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.indigo-shop .filters{margin-top:16px}.indigo-shop .filters button{font-size:15px}.indigo-shop footer{position:sticky;bottom:-24px;background:var(--night);border-top:3px double var(--cyan);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;margin-top:22px;z-index:2}.indigo-shop footer input{width:180px}.indigo-shop .receipt-list{max-height:225px;overflow:auto;margin-top:12px}
.indigo-hud{position:absolute;inset:0;pointer-events:none;font-size:15px}.indigo-hud .top{position:absolute;top:16px;left:16px;right:16px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.indigo-hud .panel{padding:12px 16px;background:#10102af2}.indigo-hud .name{font-size:30px;line-height:1.1;margin-top:5px}.indigo-hud .numbers{display:flex;gap:22px;margin-top:12px}.indigo-hud strong{font-size:25px;color:var(--gold)}.indigo-hud small{font-size:12px}.indigo-hud .world{text-align:right}.indigo-hud .world strong{font-size:17px}.indigo-hud .muted{font-size:13px}.indigo-hud .roster{margin-top:10px;display:grid;gap:5px;min-width:180px;max-height:44vh;overflow:auto}.indigo-hud .row{display:flex;justify-content:space-between;gap:18px;font-size:14px}.indigo-hud .bottom{position:absolute;bottom:18px;left:16px;right:16px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}.indigo-hud button{pointer-events:auto;font-size:15px;padding:9px 12px}.indigo-hud .controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:600px}.indigo-hud .keys{margin-top:7px;color:#b6c7dd;font-size:13px}.indigo-hud .economy{display:flex;gap:16px;margin-top:10px;color:var(--mint)}.indigo-hud .armament{margin-top:8px;color:var(--gold)}.indigo-hud .loadout{display:flex;gap:6px;max-width:380px;max-height:110px;overflow:auto;flex-wrap:wrap;margin-top:8px;pointer-events:auto}.indigo-hud .loadout button{font-size:13px;padding:6px 8px}.indigo-hud .result{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:min(490px,90vw)}.indigo-hud .result h1{font-size:32px;margin:10px 0 20px}.indigo-hud .scores{display:grid;gap:10px;max-height:45vh;overflow:auto}
.terra-title{width:min(1080px,94vw);min-height:640px;max-height:92vh;overflow:auto;position:relative;text-align:center;padding:24px 36px;background:repeating-linear-gradient(0deg,#10102a 0 3px,#121730 3px 6px);border:4px double var(--cyan);box-shadow:8px 8px 0 #080810}.terra-title .logo{display:block;width:min(850px,100%);height:auto;margin:0 auto;animation:terra-logo .8s cubic-bezier(.16,.8,.3,1) both}.terra-title .tagline{color:var(--cyan);letter-spacing:.12em;font-size:17px;margin:10px 0 24px}.terra-title .title-actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:540px;margin:0 auto}.terra-title .press-start{font-size:26px;margin:18px 0;color:var(--gold);animation:terra-pulse 1.8s steps(2,end) infinite}.terra-title .copyright{font-size:14px;color:#b6c7dd;margin-top:24px}.terra-page{width:min(760px,92vw);max-height:88vh;overflow:auto}.terra-page h1{margin-bottom:22px}.terra-page ul{padding-left:24px}.terra-page li{margin:12px 0}.terra-page .actions{margin-top:28px}
.terra-transition{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:#080810b0;pointer-events:auto;overflow:hidden}.terra-transition:before,.terra-transition:after{content:'';position:absolute;left:-10%;width:120%;height:12px;background:repeating-linear-gradient(90deg,#ffd447 0 20px,#080810 20px 40px);transform:rotate(-4deg);animation:terra-stripe .45s linear infinite}.terra-transition:before{top:20%}.terra-transition:after{bottom:20%;animation-direction:reverse}.terra-card{text-align:center;width:min(900px,90vw);background:#10102a;border:6px double #35d9ff;box-shadow:12px 12px 0 #080810;padding:28px;animation:terra-card 1s both;position:relative}.terra-card .callout{font-size:clamp(32px,5vw,72px);color:#ffd447;text-shadow:4px 4px 0 #a32864,8px 8px 0 #080810;line-height:1.1;overflow-wrap:anywhere;margin:12px 0}.terra-card .sub{color:#70f8a0;font-size:24px}.terra-card.long{animation:terra-logo .3s both}.terra-card .eyebrow{font-size:21px}.terra-card .turn-score{font-size:24px;margin-top:14px;color:#fff1c1}
@keyframes terra-logo{from{opacity:0;transform:translateY(-50px) scale(1.12)}to{opacity:1;transform:none}}@keyframes terra-pulse{50%{opacity:.55}}@keyframes terra-stripe{to{translate:40px 0}}@keyframes terra-card{0%{opacity:0;transform:translateX(-80px) scaleX(1.1)}12%,77%{opacity:1;transform:none}100%{opacity:0;transform:translateX(70px)}}
@media(max-width:760px){.terra{font-size:16px}.indigo-setup .columns,.indigo-shop .layout{grid-template-columns:1fr}.indigo-setup .intro{display:none}.indigo-shop .cards{grid-template-columns:1fr}.indigo-shop footer,.indigo-shop header{position:static;flex-wrap:wrap}.terra-title{min-height:0;padding:22px}.terra-title .title-actions{grid-template-columns:1fr 1fr}.indigo-hud .world{max-width:200px}.indigo-hud .numbers{gap:12px}.indigo-hud .bottom{flex-wrap:wrap}.terra .fields{gap:12px}}
@media(prefers-reduced-motion:reduce){.terra *,.terra *:before,.terra *:after{animation:none!important;transition:none!important}}

.terra input[type=number]{appearance:textfield}.terra input::-webkit-inner-spin-button,.terra input::-webkit-outer-spin-button{appearance:none;margin:0}

.indigo-hud .wallet-anchor{position:relative}.wallet-awards{position:absolute;left:0;top:calc(100% + 6px);pointer-events:none;white-space:nowrap}.wallet-award{display:block;color:var(--mint);font-size:19px;background:var(--ink);border:2px solid var(--mint);padding:3px 8px;text-shadow:2px 2px 0 var(--ink);animation:wallet-award 1.5s ease-out both}@keyframes wallet-award{0%{opacity:0;transform:translateY(8px) scale(.9)}15%,70%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-6px)}}

.indigo-hud .economy{padding-bottom:32px}

.terra-card.radar{border-color:var(--mint);clip-path:polygon(0 12px,12px 12px,12px 0,calc(100% - 12px) 0,calc(100% - 12px) 12px,100% 12px,100% calc(100% - 12px),calc(100% - 12px) calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,12px calc(100% - 12px),0 calc(100% - 12px));animation:terra-radar 1s both}.terra-card.receipt{border-color:var(--gold);border-left-width:18px;border-right-width:18px}.terra-card.receipt .turn-score{background:var(--ink);padding:12px;color:var(--mint)}
@keyframes terra-radar{0%{opacity:0;transform:scale(1.12)}12%,77%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.94)}}
.indigo-hud .result{width:min(780px,88vw);max-height:70vh;overflow:auto;pointer-events:auto}.indigo-hud .result .row{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.indigo-hud .result .eyebrow{margin:14px 0}.indigo-hud .roster{max-width:340px}.indigo-hud .roster .row>span:first-child{max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:1000px){.indigo-hud .top{gap:6px}.indigo-hud .world{max-width:200px}.indigo-hud .roster{min-width:130px}.indigo-hud .roster .row{font-size:12px;gap:6px}.indigo-hud .name{max-width:330px;overflow-wrap:anywhere}.indigo-hud .panel{padding:8px}.indigo-hud .numbers{gap:10px}.indigo-hud .bottom>.panel{max-width:50vw}}

</style>
<main class="terra terra-page terra-panel" aria-label="Pause menu">
  <div class="eyebrow">SCORCHED TERRA</div><h1>HOLD YOUR FIRE</h1>
  <p data-talus-bind="exitStatus">The battlefield can wait.</p>
  <div class="actions"><button class="primary" data-talus-action="resume">Resume battle</button><button data-talus-action="resume" data-talus-event="finish-action" data-talus-show="exitBlocked" data-talus-bind="exitFinishLabel" hidden>Finish action, then pause</button><button data-talus-action="resume" data-talus-event="cancel-exit" data-talus-show="exitDraining" hidden>Cancel exit preparation</button><button data-talus-action="settings">Options</button><button data-talus-action="menu" data-talus-attr-disabled="exitBlocked">Game menu</button><button data-talus-action="quit" data-talus-attr-disabled="exitBlocked">Quit game</button></div>
</main>
