<style>
.indigo-hud{position:absolute;inset:0;color:#f4f2ff;font:14px system-ui;pointer-events:none}.indigo-hud [hidden]{display:none!important}.indigo-hud .top{position:absolute;top:22px;left:24px;right:24px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.indigo-hud .panel{background:#111725ed;border:1px solid #44475f;border-radius:10px;padding:14px 18px;box-shadow:0 8px 25px #0005}.indigo-hud .eyebrow{font-size:10px;font-weight:700;letter-spacing:.18em;color:#aaa3c7;margin-bottom:6px}.indigo-hud .name{font-size:25px;font-weight:750}.indigo-hud .numbers{display:flex;gap:26px;margin-top:12px}.indigo-hud strong{font-size:22px}.indigo-hud small{display:block;font-size:10px;color:#a6b0c8;letter-spacing:.08em}.indigo-hud .world{text-align:right}.indigo-hud .world strong{font-size:15px}.indigo-hud .muted{color:#a6b0c8;font-size:12px}.indigo-hud .roster{margin-top:12px;display:grid;gap:6px;min-width:180px}.indigo-hud .row{display:flex;justify-content:space-between;gap:20px;font-size:12px}.indigo-hud .bottom{position:absolute;bottom:24px;left:24px;right:24px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px}.indigo-hud button{pointer-events:auto;border:1px solid #62617c;background:#262a40;color:#e5ddff;padding:11px 15px;border-radius:7px;font:600 13px system-ui;cursor:pointer}.indigo-hud button:hover{background:#41415d}.indigo-hud .fire{background:#c4b4ff;color:#171627;border-color:#c4b4ff}.indigo-hud .controls{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.indigo-hud .keys{margin-top:8px;color:#a6b0c8;font-size:12px}.indigo-hud .result{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:390px}.indigo-hud .result h1{font-size:32px;margin:6px 0 20px}.indigo-hud .scores{display:grid;gap:10px}.indigo-hud .scores .row{font-size:14px}
</style>
<style>
.indigo-hud .speech-layer{position:absolute;inset:0;z-index:2;pointer-events:none}
.indigo-hud .speech{position:absolute;transform:translate(-50%,-100%);width:240px;max-width:calc(100vw - 40px);padding:11px 13px;background:#111725f5;border:1px solid #a59cc4;border-radius:12px;box-shadow:0 5px 18px #0008;font:600 15px/1.35 system-ui;text-align:center;overflow-wrap:anywhere;transition:opacity 90ms linear}
.indigo-hud .speech:after{content:'';position:absolute;left:calc(50% - 6px);bottom:-7px;width:12px;height:12px;background:#111725;transform:rotate(45deg);border-right:1px solid #a59cc4;border-bottom:1px solid #a59cc4}
.indigo-hud .speech-label{display:flex;justify-content:center;gap:8px;align-items:baseline;margin-bottom:5px;font-size:11px}
.indigo-hud .speech-label small{font-size:8px;letter-spacing:.12em}
.indigo-hud .economy{display:flex;gap:16px;margin-top:10px;color:#b7f0c6;font-size:12px}.indigo-hud .armament{margin-top:8px;font-size:13px}.indigo-hud .loadout{display:flex;gap:5px;max-width:320px;flex-wrap:wrap;margin-top:8px}.indigo-hud .loadout button{font-size:10px;padding:6px 8px}.indigo-hud button.selected{border-color:#b7f0c6;color:#b7f0c6}.indigo-hud button:disabled{opacity:.4;cursor:default}
</style>
<div class="indigo-hud">
  <div class="speech-layer" data-talus-each="speech"><template><div class="speech" data-talus-style-left="left" data-talus-style-top="top" data-talus-style-opacity="opacity"><div class="speech-label"><span data-talus-bind="name" data-talus-style-color="color"></span><small data-talus-bind="kind"></small></div><div data-talus-bind="text"></div></div></template></div>
  <div class="top">
    <section class="panel"><div class="eyebrow"><span data-talus-bind="current.control"></span> · TURN <span data-talus-bind="turnNumber"></span></div>
      <div class="name" data-talus-bind="current.name" data-talus-style-color="current.color"></div>
      <div class="numbers"><div><small>ANGLE</small><strong data-talus-bind="current.angle" data-talus-fixed="0"></strong>°</div><div><small>POWER</small><strong data-talus-bind="current.power" data-talus-fixed="0"></strong>%</div><div><small>TIME</small><strong data-talus-bind="remaining"></strong>s</div><div><small>HULL</small><strong data-talus-bind="current.health"></strong></div></div>
      <div style="display:flex;align-items:center;gap:14px;margin-top:12px"><span style="display:block;width:30px;height:4px;background:#c4b4ff;transform-origin:center" data-talus-style-transform="aimRotation"></span><span class="muted" data-talus-bind="shotDirection"></span></div>
      <div class="muted" style="margin-top:10px"><span data-talus-bind="tactic"></span> <span data-talus-bind="target"></span></div>
      <div class="economy"><span>Wallet $<span data-talus-bind="cash"></span></span><span>Round +$<span data-talus-bind="roundCash"></span></span></div>
      <div class="armament"><span data-talus-bind="weaponName"></span> · <span data-talus-bind="weaponAmmo"></span> rounds</div>
      <div class="loadout" data-talus-show="canEquip" data-talus-each="loadout"><template><button data-talus-attr-data-talus-action="action" data-talus-attr-disabled="disabled" data-talus-class-selected="selected"><span data-talus-bind="name"></span> · <span data-talus-bind="stock"></span></button></template></div>
      <div class="muted" style="margin-top:8px">Jet <span data-talus-bind="supplies.jet"></span>s / <span data-talus-bind="supplies.jetCapacity"></span>s loaded (<span data-talus-bind="supplies.jetStock"></span>s total) · Digger <span data-talus-bind="supplies.dig"></span>s<br>Shield <span data-talus-bind="supplies.shield"></span>/<span data-talus-bind="supplies.shieldCapacity"></span> · Mag power <span data-talus-bind="supplies.magnet"></span>/<span data-talus-bind="supplies.magnetCapacity"></span></div>
      <div class="loadout" data-talus-show="human" hidden><button data-talus-action="shield" data-talus-class-selected="supplies.shieldOn">Shield on/off</button><button data-talus-action="magnet" data-talus-class-selected="supplies.magnetOn">Mag on/off</button><button data-talus-action="battery">Repair +30 · <span data-talus-bind="batteries"></span> left</button></div>
    </section>
    <section class="panel world"><div class="eyebrow">INDIGO</div><strong data-talus-bind="biome"></strong><div class="muted">Seed <span data-talus-bind="seed"></span> · <span data-talus-bind="tankCount"></span> tanks</div>
      <div class="roster" data-talus-each="roster"><template><div class="row"><span data-talus-bind="name" data-talus-style-color="color"></span><span><span data-talus-bind="health"></span> HP · <span data-talus-bind="status"></span></span></div></template></div>
    </section>
  </div>
  <section class="panel result" data-talus-show="finished" hidden><div class="eyebrow">MATCH COMPLETE</div><h1 data-talus-bind="status"></h1><div class="scores" data-talus-each="scores"><template><div class="row"><span data-talus-bind="name"></span><span><span data-talus-bind="wins"></span> wins · <span data-talus-bind="kills"></span> kills</span></div></template></div></section>
  <div class="bottom">
    <div class="panel"><div data-talus-bind="status"></div><div class="muted" data-talus-bind="frameNotice"></div><div class="muted" style="margin-top:7px" data-talus-bind="lastHit"></div><div style="margin-top:7px;color:#ffbd82" data-talus-bind="chaosNotice"></div><div style="margin-top:7px;color:#b7f0c6" data-talus-bind="cashNotice"></div><div class="keys" data-talus-show="human" hidden>A / D move · ← / → aim · ↑ / ↓ power · W hold jet · Q / E burrow · Space fire · Enter pass</div></div>
    <div class="controls">
      <button class="fire" data-talus-action="begin" data-talus-show="ready" hidden>Begin match →</button>
      <div class="controls" data-talus-show="human" hidden><button data-talus-action="angle-up">Angle +</button><button data-talus-action="angle-down">Angle −</button><button data-talus-action="power-up">Power +</button><button data-talus-action="power-down">Power −</button><button data-talus-action="pass">Pass</button><button class="fire" data-talus-action="fire">Fire shell</button></div>
      <button data-talus-action="setup" data-talus-show="canSetup" hidden>New match</button>
      <button data-talus-action="shop" data-talus-show="canShop" hidden>Armory</button>
    </div>
  </div>
</div>
