<style>
.indigo-hud{position:absolute;inset:0;font:14px system-ui,sans-serif;color:#f4f2ff;pointer-events:none}.indigo-hud .top{position:absolute;top:22px;left:24px;right:24px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.indigo-hud .panel{background:#111725e8;border:1px solid #44475f;border-radius:10px;padding:14px 18px;box-shadow:0 8px 25px #0005}.indigo-hud .eyebrow{font-size:10px;font-weight:700;letter-spacing:.18em;color:#a7a0c3;margin-bottom:6px}.indigo-hud .name{font-size:23px;font-weight:750;line-height:1.2}.indigo-hud .numbers{display:flex;gap:28px;margin-top:12px}.indigo-hud .numbers strong{font-size:21px}.indigo-hud .numbers small{display:block;font-size:10px;color:#98a3bd;letter-spacing:.1em}.indigo-hud .world{text-align:right;font-size:13px}.indigo-hud .muted{color:#98a3bd;font-size:12px}.indigo-hud .bottom{position:absolute;bottom:24px;left:24px;right:24px;display:flex;align-items:center;justify-content:space-between;gap:16px}.indigo-hud button{pointer-events:auto;border:1px solid #62617c;background:#262a40;color:#e5ddff;padding:10px 15px;border-radius:7px;font:600 12px system-ui;cursor:pointer}.indigo-hud button:hover{background:#41415d}.indigo-hud .controls{display:flex;gap:8px}.indigo-hud .status{font-size:13px;color:#c0c8df}
</style>
<style>.indigo-hud [hidden]{display:none!important}</style>
<div class="indigo-hud">
  <div class="top">
    <section class="panel">
      <div class="eyebrow" data-talus-bind="current.control">TANK</div>
      <div class="name" data-talus-bind="current.name" data-talus-style-color="current.color"></div>
      <div class="numbers"><div><small>ANGLE</small><strong data-talus-bind="current.angle"></strong>°</div><div><small>POWER</small><strong data-talus-bind="current.power"></strong>%</div><div><small>TURN</small><strong data-talus-bind="turnSeconds"></strong>s</div></div>
    </section>
    <section class="panel world"><div class="eyebrow">INDIGO</div><strong data-talus-bind="biome"></strong><div class="muted">Seed <span data-talus-bind="seed"></span> · <span data-talus-bind="tankCount"></span> tanks</div></section>
  </div>
  <div class="bottom"><div class="panel status" data-talus-bind="status"></div><div class="controls" data-talus-show="ready" hidden><button data-talus-action="previous-tank">← Previous tank</button><button data-talus-action="next-tank">Next tank →</button><button data-talus-action="setup">New match</button></div></div>
</div>
