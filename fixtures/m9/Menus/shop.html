<style>
.indigo-shop{box-sizing:border-box;width:min(1110px,94vw);max-height:88vh;overflow:auto;padding:28px;background:linear-gradient(135deg,#26283a,#111623 65%);border:1px solid #5d5870;border-radius:16px;color:#eeeef7;font:14px/1.45 system-ui;box-shadow:0 30px 110px #0009}
.indigo-shop *{box-sizing:border-box}.indigo-shop [hidden]{display:none!important}.indigo-shop header{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid #414458;padding-bottom:18px}.indigo-shop h1{font-size:35px;margin:3px 0}.indigo-shop h2{font-size:24px;margin:8px 0}.indigo-shop .eyebrow{font-size:10px;letter-spacing:.18em;color:#baafd7;font-weight:750}.indigo-shop .muted{font-size:12px;color:#adb5cd}.indigo-shop .layout{display:grid;grid-template-columns:240px 1fr;gap:24px;margin-top:22px}.indigo-shop .wallet{font-size:36px;font-weight:800;color:#b7f0c6}.indigo-shop .basket{background:#101521;padding:16px;border-radius:10px;align-self:start}.indigo-shop .receipt{display:flex;justify-content:space-between;padding:3px 0;font-size:12px}.indigo-shop .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.indigo-shop .card{padding:15px;background:#1b2131;border:1px solid #42485d;border-radius:10px;display:flex;flex-direction:column;gap:9px}.indigo-shop .card h3{font-size:17px;margin:0}.indigo-shop .card p{font-size:12px;color:#bec6db;margin:0;flex:1}.indigo-shop .card-footer{display:flex;justify-content:space-between;gap:10px;align-items:center}.indigo-shop button{border:1px solid #656278;background:#39354e;color:#f0e9ff;border-radius:7px;padding:9px 13px;font:600 12px system-ui;cursor:pointer}.indigo-shop button:hover{background:#504967}.indigo-shop button:disabled{opacity:.45;cursor:default}.indigo-shop .primary{background:#c4b4ff;color:#171627;font-size:14px;border-color:#c4b4ff}.indigo-shop .nav{display:flex;align-items:center;gap:12px}.indigo-shop footer{position:sticky;bottom:-28px;background:#111623f5;border-top:1px solid #414458;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;margin-top:22px}.indigo-shop input{border:1px solid #52566c;border-radius:6px;padding:9px;background:#090e19;color:#fff;width:180px}.indigo-shop .receipt-list{max-height:225px;overflow:auto;margin-top:12px}.indigo-shop .help{margin:14px 0 0;color:#9faac3;font-size:12px}
@media(max-width:740px){.indigo-shop{padding:18px}.indigo-shop .layout{grid-template-columns:1fr}.indigo-shop .cards{grid-template-columns:1fr}.indigo-shop footer{position:static;flex-wrap:wrap}.indigo-shop h1{font-size:26px}}
.indigo-shop .filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}.indigo-shop .filters .selected{background:#c4b4ff;color:#171627}
</style>
<main class="indigo-shop">
  <header><div><div class="eyebrow" data-talus-bind="shop.title"></div><h1>The Armory</h1><div class="muted" data-talus-bind="shop.result"></div></div><div class="nav"><button data-talus-action="shop-prev">← Pilot</button><span><span data-talus-bind="shop.index"></span> / <span data-talus-bind="shop.count"></span></span><button data-talus-action="shop-next">Pilot →</button></div></header>
  <nav class="filters" data-talus-each="shop.categories"><template><button data-talus-attr-data-talus-action="action" data-talus-class-selected="selected" data-talus-bind="name"></button></template></nav>
  <div class="layout">
    <aside class="basket"><div class="eyebrow">PERSONAL WALLET</div><h2 data-talus-bind="shop.name" data-talus-style-color="shop.color"></h2><div class="wallet">$<span data-talus-bind="shop.cash"></span></div><div class="muted">This round earned $<span data-talus-bind="shop.earned"></span></div><p class="help" data-talus-bind="shop.message"></p><div class="receipt-list" data-talus-each="shop.receipts"><template><div class="receipt"><span data-talus-bind="action"></span><span>+$<span data-talus-bind="amount"></span></span></div></template></div><p class="help">Fire, land shots, deal damage—even to yourself—and get paid. Dying pays too. Unspent cash and supplies stay with your name.</p></aside>
    <div class="cards" data-talus-each="shop.items"><template><article class="card"><div class="eyebrow" data-talus-bind="category"></div><h3 data-talus-bind="name"></h3><p data-talus-bind="description"></p><div class="muted">In stock: <span data-talus-bind="stock"></span></div><div class="card-footer"><span data-talus-bind="price"></span><button data-talus-attr-data-talus-action="action" data-talus-attr-disabled="disabled" data-talus-bind="button"></button></div></article></template></div>
  </div>
  <input type="hidden" name="account" data-talus-value="shop.account"><input type="hidden" name="revision" data-talus-value="shop.revision">
  <input type="hidden" name="deploy" value="yes"><input type="hidden" name="humans" data-talus-value="shop.humans"><input type="hidden" name="computers" data-talus-value="shop.computers"><input type="hidden" name="turnSeconds" data-talus-value="shop.turnSeconds"><input type="hidden" name="namesText" data-talus-value="shop.namesText"><input type="hidden" name="generation" data-talus-value="shop.generation"><input type="hidden" name="round" data-talus-value="shop.round">
  <footer><button data-talus-action="shop-close">Back to battlefield</button><div data-talus-show="shop.finished" hidden><label class="muted">Next map seed <input name="seed" type="text" inputmode="numeric" placeholder="Random"></label></div><button class="primary" data-talus-action="new-game" data-talus-show="shop.finished" hidden>Deploy next round →</button><span class="muted" data-talus-show="shop.ready">Close the armory, then begin your round.</span></footer>
</main>
